name: AI Sweden Börsdata Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-sweden/**'
      - '.github/workflows/ai-sweden-smoke-test.yml'

jobs:
  test-borsdata:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-sweden
    env:
      BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Börsdata connection
        run: python smoke_test.py
